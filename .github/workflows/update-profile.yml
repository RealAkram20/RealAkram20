name: Refresh profile telemetry

on:
  schedule:
    - cron: "0 * * * *"      # every hour, on the hour
  workflow_dispatch: {}      # run it by hand from the Actions tab
  push:
    branches: [main]         # re-render after every edit to content.mjs

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render SVGs with live stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. A fine-grained personal token (read-only: metadata, contents)
          # lets the counters include private repositories. Without it, public only.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/build.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --quiet --cached || git commit -m "chore: refresh profile telemetry"
          git push
