<svg viewBox="0 0 1000 380" width="1000" height="380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack: backend, web, mobile, websites, payments, infra, tooling. One Laravel API feeding React web and Expo mobile.">
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .grow{transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .up{transform:scaleY(0);animation:up 1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes up{to{transform:scaleY(1)}}
    .ping{animation:ping 2.4s ease-out infinite}
    @keyframes ping{0%{transform:scale(.4);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .blink{animation:blink 1.1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    .rot{opacity:0;animation:rot 16s linear infinite}
    @keyframes rot{0%{opacity:0}1.5%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
    .type{animation:type 2.6s steps(44,end) .9s forwards;transform:scaleX(0)}
    @keyframes type{to{transform:scaleX(1)}}
    .packet{animation:packet 3.2s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes packet{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(540px);opacity:0}}
    .drift{animation:drift 30s linear infinite}
    @keyframes drift{to{transform:translate(32px,32px)}}
    @media (prefers-reduced-motion:reduce){
      .rise,.fade,.draw,.grow,.up,.ping,.pulse,.blink,.flow,.rot,.type,.packet,.drift{animation:none}
      .rise,.fade{opacity:1} .draw{stroke-dashoffset:0} .grow{transform:scaleX(1)} .up{transform:scaleY(1)}
      .ping,.packet{opacity:0} .rot{opacity:0} .rot.first{opacity:1} .type{transform:scaleX(1)}
    }
  </style>
  <line x1="138" y1="8" x2="138" y2="230" stroke="#d9dee7" opacity=".4"/>
  <g class="rise" style="animation-delay:0.1s">
      <text class="mono" x="48" y="32" font-size="12" letter-spacing="2" fill="#5b6475">BACKEND</text>
      <text class="sans" x="154" y="32" font-size="15" fill="#0b1020">PHP · Laravel · REST APIs · Queues · MySQL</text>
    </g>
<g class="rise" style="animation-delay:0.2s">
      <text class="mono" x="48" y="62" font-size="12" letter-spacing="2" fill="#5b6475">WEB</text>
      <text class="sans" x="154" y="62" font-size="15" fill="#0b1020">React · TypeScript · Tailwind CSS · Vite</text>
    </g>
<g class="rise" style="animation-delay:0.30000000000000004s">
      <text class="mono" x="48" y="92" font-size="12" letter-spacing="2" fill="#5b6475">MOBILE</text>
      <text class="sans" x="154" y="92" font-size="15" fill="#0b1020">React Native · Expo · EAS · Push notifications</text>
    </g>
<g class="rise" style="animation-delay:0.4s">
      <text class="mono" x="48" y="122" font-size="12" letter-spacing="2" fill="#5b6475">WEBSITES</text>
      <text class="sans" x="154" y="122" font-size="15" fill="#0b1020">WordPress · Elementor · SEO · Conversion-led design</text>
    </g>
<g class="rise" style="animation-delay:0.5s">
      <text class="mono" x="48" y="152" font-size="12" letter-spacing="2" fill="#5b6475">PAYMENTS</text>
      <text class="sans" x="154" y="152" font-size="15" fill="#0b1020">MTN Mobile Money · Airtel Money · Card gateways</text>
    </g>
<g class="rise" style="animation-delay:0.6s">
      <text class="mono" x="48" y="182" font-size="12" letter-spacing="2" fill="#5b6475">INFRA</text>
      <text class="sans" x="154" y="182" font-size="15" fill="#0b1020">Linux VPS · Cloudflare · Firebase · GitHub Actions</text>
    </g>
<g class="rise" style="animation-delay:0.7000000000000001s">
      <text class="mono" x="48" y="212" font-size="12" letter-spacing="2" fill="#5b6475">TOOLING</text>
      <text class="sans" x="154" y="212" font-size="15" fill="#0b1020">Git · Composer · Node · Docker · Postman · Figma</text>
    </g>
  <line x1="48" y1="262" x2="952" y2="262" stroke="#d9dee7" stroke-width="1"/>
  <line x1="48" y1="262" x2="952" y2="262" stroke="#302df4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="90 1104" opacity=".9">
    <animate attributeName="stroke-dashoffset" values="1194;0" dur="6s" begin="1s" repeatCount="indefinite"/>
  </line>
  <text class="mono fade" style="animation-delay:0.9s" x="48" y="284" font-size="10" letter-spacing="2.5" fill="#9aa3b2">ONE STACK, END TO END · ONE API FEEDS EVERY SCREEN</text>
  <line class="flow" x1="312" y1="316" x2="418" y2="316" stroke="#9aa3b2" stroke-width="1.2"/>
<line class="flow" x1="582" y1="316" x2="688" y2="316" stroke="#9aa3b2" stroke-width="1.2"/>
  <circle class="packet" cx="316" cy="316" r="3.5" fill="#302df4" style="animation-delay:1.6s"/>
  <g class="rise" style="animation-delay:1s">
      <rect x="150" y="296" width="160" height="40" rx="20" fill="#ffffff" stroke="#302df4" stroke-width="1.5"/>
      <text class="mono" x="230" y="321" font-size="11.5" letter-spacing="2.5" fill="#0b1020" text-anchor="middle">LARAVEL API</text>
    </g>
<g class="rise" style="animation-delay:1.25s">
      <rect x="420" y="296" width="160" height="40" rx="20" fill="#ffffff" stroke="#dfe4ec" stroke-width="1"/>
      <text class="mono" x="500" y="321" font-size="11.5" letter-spacing="2.5" fill="#0b1020" text-anchor="middle">REACT WEB</text>
    </g>
<g class="rise" style="animation-delay:1.5s">
      <rect x="690" y="296" width="160" height="40" rx="20" fill="#ffffff" stroke="#dfe4ec" stroke-width="1"/>
      <text class="mono" x="770" y="321" font-size="11.5" letter-spacing="2.5" fill="#0b1020" text-anchor="middle">EXPO MOBILE</text>
    </g>
  <g class="fade" style="animation-delay:1.8s">
    <text class="mono" x="230" y="358" font-size="9.5" letter-spacing="1.5" fill="#5b6475" text-anchor="middle">AUTH · QUEUES · PAYMENTS · PUSH</text>
    <text class="mono" x="500" y="358" font-size="9.5" letter-spacing="1.5" fill="#5b6475" text-anchor="middle">DASHBOARDS · CLIENT PORTALS</text>
    <text class="mono" x="770" y="358" font-size="9.5" letter-spacing="1.5" fill="#5b6475" text-anchor="middle">DRIVER · CUSTOMER · STAFF APPS</text>
  </g>
</svg>
