<svg viewBox="0 0 1000 430" width="1000" height="430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rio Akram Miiro — Full-Stack Web Developer &amp; SaaS Builder, Kampala, Uganda">
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .grow{transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .up{transform:scaleY(0);animation:up 1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes up{to{transform:scaleY(1)}}
    .ping{animation:ping 2.4s ease-out infinite}
    @keyframes ping{0%{transform:scale(.4);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .blink{animation:blink 1.1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    .rot{opacity:0;animation:rot 16s linear infinite}
    @keyframes rot{0%{opacity:0}1.5%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
    .type{animation:type 2.6s steps(44,end) .9s forwards;transform:scaleX(0)}
    @keyframes type{to{transform:scaleX(1)}}
    .packet{animation:packet 3.2s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes packet{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(540px);opacity:0}}
    .drift{animation:drift 30s linear infinite}
    @keyframes drift{to{transform:translate(32px,32px)}}
    @media (prefers-reduced-motion:reduce){
      .rise,.fade,.draw,.grow,.up,.ping,.pulse,.blink,.flow,.rot,.type,.packet,.drift{animation:none}
      .rise,.fade{opacity:1} .draw{stroke-dashoffset:0} .grow{transform:scaleX(1)} .up{transform:scaleY(1)}
      .ping,.packet{opacity:0} .rot{opacity:0} .rot.first{opacity:1} .type{transform:scaleX(1)}
    }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#302df4" stroke-opacity=".07" fill="none"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/><stop offset=".35" stop-color="white" stop-opacity="1"/><stop offset="1" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="0" width="1000" height="430" fill="url(#fadeR)"/></mask>
    <clipPath id="typeClip"><rect class="type" x="48" y="250" width="720" height="40" style="transform-origin:48px 0"/></clipPath>
  </defs>

  <g class="fade" style="animation-delay:0.1s" mask="url(#gridMask)"><rect class="drift" x="-64" y="-64" width="1128" height="558" fill="url(#grid)"/></g>

  <!-- corner frame -->
  <path class="draw" style="animation-delay:0.2s" d="M952 58 V 32 H 926" stroke="#302df4" stroke-width="1.5"/>
  <path class="draw" style="animation-delay:0.2s" d="M48 372 V 398 H 74" stroke="#302df4" stroke-width="1.5"/>

  <line x1="48" y1="58" x2="952" y2="58" stroke="#d9dee7" stroke-width="1"/>
  <line x1="48" y1="58" x2="952" y2="58" stroke="#302df4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="90 1104" opacity=".9">
    <animate attributeName="stroke-dashoffset" values="1194;0" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </line>
  <g class="fade" style="animation-delay:0.3s">
    <text class="mono" x="48" y="44" font-size="11" letter-spacing="3.5" fill="#5b6475">ARMGENIUS — FOUNDER &amp; LEAD ENGINEER</text>
    <text class="mono" x="900" y="44" font-size="11" letter-spacing="3.5" fill="#5b6475" text-anchor="end">KAMPALA, UG — 0.35° N · 32.58° E</text>
    <circle class="ping" cx="916" cy="40" r="4" stroke="#16a34a" fill="none" style="transform-origin:916px 40px"/>
    <circle cx="916" cy="40" r="3" fill="#16a34a"/>
  </g>

  <g class="rise" style="animation-delay:0.5s">
    <text class="sans" x="46" y="170" font-size="68" font-weight="700" letter-spacing="-2" fill="#0b1020">Rio Akram Miiro</text>
  </g>
  <text class="sans rot first" style="animation-delay:2s" x="48" y="222" font-size="20" fill="#5b6475">Full-Stack Web Developer · Kampala, Uganda</text>
<text class="sans rot" style="animation-delay:6s" x="48" y="222" font-size="20" fill="#5b6475">SaaS, web &amp; mobile products, built end to end</text>
<text class="sans rot" style="animation-delay:10s" x="48" y="222" font-size="20" fill="#5b6475">Laravel · React · React Native (Expo)</text>
<text class="sans rot" style="animation-delay:14s" x="48" y="222" font-size="20" fill="#5b6475">Websites that convert · SEO that gets them found</text>

  <!-- typed terminal line -->
  <g class="fade" style="animation-delay:0.8s">
    <rect x="48" y="252" width="720" height="36" rx="6" fill="#eceeff"/>
    <g clip-path="url(#typeClip)">
      <text class="mono" x="62" y="275" font-size="13.5" fill="#302df4">&gt; building ride-hailing, delivery &amp; POS platforms from Kampala</text>
    </g>
    <rect class="blink" x="567.3" y="263" width="7" height="16" fill="#302df4" opacity=".9"/>
  </g>

  <g class="fade" style="animation-delay:1.3s">
    <text class="mono" x="48" y="328" font-size="12" letter-spacing="1" fill="#9aa3b2">FOCUS ▸</text>
    <text class="mono" x="128" y="328" font-size="12" letter-spacing="1" fill="#0b1020">Business websites · SEO · SaaS platforms · Mobile apps · Payments</text>
  </g>
  <g class="fade" style="animation-delay:1.5s">
    <text class="mono" x="48" y="352" font-size="12" letter-spacing="1" fill="#9aa3b2">OPEN TO ▸</text>
    <text class="mono" x="128" y="352" font-size="12" letter-spacing="1" fill="#0b1020">Freelance · Contract · Partnerships · Founders with a real idea</text>
  </g>

  <line class="draw" style="animation-delay:1.6s" x1="48" y1="372" x2="952" y2="372" stroke="#d9dee7"/>
  <g class="fade" style="animation-delay:1.9s">
    <text class="mono" x="48" y="404" font-size="11.5" letter-spacing="3" fill="#5b6475">LARAVEL</text>
    <text class="mono" x="150" y="404" font-size="11.5" fill="#302df4">·</text>
    <text class="mono" x="172" y="404" font-size="11.5" letter-spacing="3" fill="#5b6475">REACT</text>
    <text class="mono" x="254" y="404" font-size="11.5" fill="#302df4">·</text>
    <text class="mono" x="276" y="404" font-size="11.5" letter-spacing="3" fill="#5b6475">REACT NATIVE</text>
    <text class="mono" x="440" y="404" font-size="11.5" fill="#302df4">·</text>
    <text class="mono" x="462" y="404" font-size="11.5" letter-spacing="3" fill="#5b6475">WORDPRESS</text>
    <text class="mono" x="952" y="404" font-size="11.5" letter-spacing="3" fill="#5b6475" text-anchor="end">ARMGENIUS.COM</text>
  </g>
</svg>
