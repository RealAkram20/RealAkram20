<svg viewBox="0 0 1000 120" width="1000" height="120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AVAILABLE FOR PROJECTS — Q4 2026. armgenius.com · rio@armgenius.com">
  <style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .grow{transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .up{transform:scaleY(0);animation:up 1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes up{to{transform:scaleY(1)}}
    .ping{animation:ping 2.4s ease-out infinite}
    @keyframes ping{0%{transform:scale(.4);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .blink{animation:blink 1.1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    .rot{opacity:0;animation:rot 16s linear infinite}
    @keyframes rot{0%{opacity:0}1.5%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
    .type{animation:type 2.6s steps(44,end) .9s forwards;transform:scaleX(0)}
    @keyframes type{to{transform:scaleX(1)}}
    .packet{animation:packet 3.2s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes packet{0%{transform:translateX(0);opacity:0}6%{opacity:1}94%{opacity:1}100%{transform:translateX(540px);opacity:0}}
    .drift{animation:drift 30s linear infinite}
    @keyframes drift{to{transform:translate(32px,32px)}}
    @media (prefers-reduced-motion:reduce){
      .rise,.fade,.draw,.grow,.up,.ping,.pulse,.blink,.flow,.rot,.type,.packet,.drift{animation:none}
      .rise,.fade{opacity:1} .draw{stroke-dashoffset:0} .grow{transform:scaleX(1)} .up{transform:scaleY(1)}
      .ping,.packet{opacity:0} .rot{opacity:0} .rot.first{opacity:1} .type{transform:scaleX(1)}
    }
  </style>
  <line x1="48" y1="24" x2="952" y2="24" stroke="#d9dee7" stroke-width="1"/>
  <line x1="48" y1="24" x2="952" y2="24" stroke="#302df4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="90 1104" opacity=".9">
    <animate attributeName="stroke-dashoffset" values="1194;0" dur="5s" begin="0s" repeatCount="indefinite"/>
  </line>
  <circle class="ping" cx="60" cy="66" r="5" stroke="#16a34a" fill="none" style="transform-origin:60px 66px"/>
  <circle class="pulse" cx="60" cy="66" r="4" fill="#16a34a"/>
  <text class="mono rise" style="animation-delay:0.2s" x="82" y="62" font-size="12" letter-spacing="3" fill="#0b1020">AVAILABLE FOR PROJECTS — Q4 2026</text>
  <text class="sans rise" style="animation-delay:0.4s" x="82" y="84" font-size="12.5" fill="#5b6475">Tell me what the business needs to do. I will build the system that does it.</text>
  <text class="mono fade" style="animation-delay:0.6s" x="952" y="66" font-size="13" text-anchor="end" fill="#5b6475">armgenius.com  ·  rio@armgenius.com</text>
  <text class="mono fade" style="animation-delay:0.8s" x="952" y="86" font-size="11" text-anchor="end" fill="#9aa3b2">Kampala, Uganda  ·  © 2026 ArmGenius</text>
</svg>
